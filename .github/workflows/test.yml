name: 🧪 Run Tests

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'src/**/*.nim'
      - 'tests/**/*.nim{s,}'
      - 'nnl.nimble'
      - 'flake.nix'
      - '.github/workflows/test.yml'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
    - name: Setup dependencies
      run: nix develop --command nimble setup -l
    - name: Run Tests
      run: nix develop --command nim c -r tests/tnnl.nim


